<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="disc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2e" />
      <stop offset="50%" stop-color="#141416" />
      <stop offset="100%" stop-color="#2c2c2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer Groove Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2" />

  <!-- Center Vinyl Label -->
  <circle cx="256" cy="256" r="64" fill="url(#disc)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <circle cx="256" cy="256" r="12" fill="#000000" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Audio Wave Bars on Side -->
  <rect x="250" y="110" width="12" height="40" rx="6" fill="url(#accent)" opacity="0.9" />
  <rect x="274" y="125" width="12" height="25" rx="6" fill="url(#accent)" opacity="0.7" />
  <rect x="226" y="120" width="12" height="30" rx="6" fill="url(#accent)" opacity="0.7" />
</svg>
